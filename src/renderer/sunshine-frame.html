<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./shared/palette.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foundation Desktop</title>
    <script>
      ;(() => {
        let theme = 'dark'
        try {
          const saved = JSON.parse(localStorage.getItem('foundation-desktop-theme'))
          theme = (saved?.mode || saved?.preset) === 'light' ? 'light' : 'dark'
        } catch { /* Match the shared theme's default when storage is unavailable. */ }

        document.documentElement.setAttribute('data-bs-theme', theme)
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --boot-background: var(--ui-page-bg);
        --boot-foreground: var(--ui-text-primary);
        --boot-shadow: var(--ui-accent-soft);
      }

      body {
        overflow: hidden;
        background: var(--boot-background);
      }

      #app {
        width: 100%;
        height: 100vh;
      }

      .boot-loading {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--boot-foreground);
        font-family: var(--ui-font-family);
      }

      .boot-loading img {
        width: min(180px, 36vw);
        opacity: 0.85;
        filter: drop-shadow(0 4px 12px var(--boot-shadow));
        animation: boot-gura 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .boot-loading p {
        margin-top: 20px;
        font-size: 18px;
      }

      @keyframes boot-gura {
        0% {
          transform: translateX(-80%) rotate(-5deg) translateY(-5px) scale(0.9);
        }
        45% {
          transform: translateX(0) rotate(0deg) translateY(2px) scale(1.08);
        }
        55% {
          transform: translateX(10%) rotate(3deg) translateY(-8px) scale(0.96);
        }
        100% {
          transform: translateX(80%) rotate(5deg) translateY(-5px) scale(0.9);
        }
      }


    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-loading" role="status" aria-live="polite">

        <p>Preparing Sunshine...</p>
      </div>
    </div>
    <script type="module" src="./sunshine-frame.js"></script>
  </body>
</html>
